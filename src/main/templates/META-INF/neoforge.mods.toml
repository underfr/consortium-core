# Template: the generateModMetadata Gradle task expands the placeholders from gradle.properties
# and writes the result to build/generated/sources/modMetadata/META-INF/neoforge.mods.toml.
# Only keys listed in build.gradle's replaceProperties may appear between a dollar sign and braces here.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional integrations: the mod loads without them, and after them when they are present.
[[dependencies.${mod_id}]]
    modId="kubejs"
    type="optional"
    versionRange="[2101.7.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbteams"
    type="optional"
    versionRange="[2101.1.9,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbquests"
    type="optional"
    versionRange="[2101.1.30,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sdlink"
    type="optional"
    versionRange="[3.4.0,)"
    ordering="AFTER"
    side="SERVER"
