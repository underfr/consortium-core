name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compiles the mod and runs the unit tests)
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: consortium-core-jar
          path: build/libs/*.jar
          if-no-files-found: error
