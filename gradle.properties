# Gradle itself runs on the host JDK (any JDK 17 to 26; the dev box has JDK 25 on PATH).
# The mod is always compiled with the JDK 21 toolchain declared in build.gradle (auto-provisioned by foojay).
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment parameter names (https://parchmentmc.org/docs/getting-started)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment (locked: Minecraft 1.21.1 + NeoForge 21.1.x, Java 21; see docs/PROJECT_RULES.md)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
neo_version_range=[21.1.0,)
# FML loader shipped with NeoForge 21.1.250 is 4.0.44
loader_version_range=[4,)

# Mod
mod_id=consortium
mod_name=Consortium Core
mod_license=MIT
mod_version=0.3.1
mod_group_id=org.consortium
mod_authors=The Consortium
mod_description=Server-side economy core for The Consortium: Consortium Credits ledger, family price table, delivery terminal, quota board, HUD, rank presence (chat, tab list, MOTD). Phases and quotas stay in the pack's KubeJS engine.

# Pack mods used as optional compile-time dependencies (versions pinned in pack/mods/*.pw.toml)
kubejs_version=2101.7.2-build.377
rhino_version=2101.2.7-build.85
ftb_library_version=2101.1.36
ftb_teams_version=2101.1.11
ftb_quests_version=2101.1.35
architectury_version=13.0.11
# Simple Discord Link (server only in the pack), compile-time only for the alert bridge
sdlink_version=3.4.4
# Chapters 1.1 = Modrinth project kBw6VkrT, version jm7ojo3K (pack/mods/chapters.pw.toml), resolved through the Modrinth Maven
chapters_version=1.1
# LuckPerms API (Maven Central net.luckperms:api), compile-only: the pack's LuckPerms 5.4.150 bundles this API class set
luckperms_api_version=5.5

# Unit test tooling (pure Java tests, no Minecraft classes)
junit_version=5.11.4
